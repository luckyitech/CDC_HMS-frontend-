<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 760 412" role="img" aria-label="The first rule that applies decides the expected hours for a day" font-size="13"><rect width="760" height="412" fill="#ffffff"/><defs><marker id="hr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2937">The first rule that applies decides the expected hours for a day</text><text x="24" y="48" font-size="11.5" fill="#6b7280">Checked in this order for each person, each day</text><g fill="none" stroke="#94a3b8" stroke-width="1.25"><path d="M444 96H520" marker-end="url(#hr-arrow)"></path><path d="M444 184H520" marker-end="url(#hr-arrow)"></path><path d="M444 272H520" marker-end="url(#hr-arrow)"></path><path d="M64 124V156" marker-end="url(#hr-arrow)"></path><path d="M64 212V244" marker-end="url(#hr-arrow)"></path><path d="M64 300V332" marker-end="url(#hr-arrow)"></path></g><g><rect x="24" y="68" width="420" height="56" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.25"></rect><text x="40" y="92" font-weight="600" fill="#1f2937">1. A roster shift or date override for that date?</text><text x="40" y="110" font-size="11.5" fill="#6b7280">Published roster cells and Working hours date overrides</text></g><g><rect x="24" y="156" width="420" height="56" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.25"></rect><text x="40" y="180" font-weight="600" fill="#1f2937">2. A public holiday?</text><text x="40" y="198" font-size="11.5" fill="#6b7280">From Leave settings, Public holidays</text></g><g><rect x="24" y="244" width="420" height="56" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.25"></rect><text x="40" y="268" font-weight="600" fill="#1f2937">3. Their own weekly hours for that weekday?</text><text x="40" y="286" font-size="11.5" fill="#6b7280">Settings, Working hours per person</text></g><g><rect x="24" y="332" width="420" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="40" y="356" font-weight="600" fill="#1f2937">4. Otherwise the clinic default hours</text><text x="40" y="374" font-size="11.5" fill="#6b7280">Mon to Fri 08:00 to 17:00, Sat 08:00 to 13:00, Sunday off</text></g><g><rect x="520" y="68" width="216" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="534" y="92" font-weight="600" fill="#1f2937">Those hours apply</text><text x="534" y="110" font-size="11.5" fill="#6b7280">even on a public holiday</text></g><g><rect x="520" y="156" width="216" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="534" y="180" font-weight="600" fill="#1f2937">Nobody is expected in</text><text x="534" y="198" font-size="11.5" fill="#6b7280">calendars show H</text></g><g><rect x="520" y="244" width="216" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="534" y="268" font-weight="600" fill="#1f2937">Those hours apply</text><text x="534" y="286" font-size="11.5" fill="#6b7280">Off means not expected</text></g><text x="482" y="88" text-anchor="middle" font-size="11.5" fill="#6b7280">yes</text><text x="482" y="176" text-anchor="middle" font-size="11.5" fill="#6b7280">yes</text><text x="482" y="264" text-anchor="middle" font-size="11.5" fill="#6b7280">yes</text><text x="74" y="144" font-size="11.5" fill="#6b7280">no</text><text x="74" y="232" font-size="11.5" fill="#6b7280">no</text><text x="74" y="320" font-size="11.5" fill="#6b7280">no</text></svg>
