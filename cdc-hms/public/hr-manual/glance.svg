<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 760 536" role="img" aria-label="Everyone has self-service; each HR screen opens with its own control" font-size="13"><rect width="760" height="536" fill="#ffffff"/><text x="24" y="32" font-size="15" font-weight="600" fill="#1f2937">Everyone has self-service; each HR screen opens with its own control</text><g><rect x="24" y="56" width="224" height="360" rx="8" fill="#2563eb" fill-opacity="0.08" stroke="#94a3b8" stroke-width="1"></rect><text x="36" y="80" font-size="13" font-weight="600" fill="#1f2937">Everyone, no control needed</text><g><rect x="32" y="96" width="208" height="44" rx="6" fill="none" stroke="#94a3b8" stroke-width="1"></rect><text x="44" y="114" font-size="13" font-weight="600" fill="#1f2937">My profile</text><text x="44" y="131" font-size="11.5" fill="#6b7280">Click your name in the sidebar</text></g><g><rect x="32" y="148" width="208" height="44" rx="6" fill="none" stroke="#94a3b8" stroke-width="1"></rect><text x="44" y="166" font-size="13" font-weight="600" fill="#1f2937">My leave</text><text x="44" y="183" font-size="11.5" fill="#6b7280">Apply and follow requests</text></g><g><rect x="32" y="200" width="208" height="44" rx="6" fill="none" stroke="#94a3b8" stroke-width="1"></rect><text x="44" y="218" font-size="13" font-weight="600" fill="#1f2937">Team calendar</text><text x="44" y="235" font-size="11.5" fill="#6b7280">Who is away this month</text></g><g><rect x="32" y="252" width="208" height="44" rx="6" fill="none" stroke="#94a3b8" stroke-width="1"></rect><text x="44" y="270" font-size="13" font-weight="600" fill="#1f2937">Dashboard</text><text x="44" y="287" font-size="11.5" fill="#6b7280">Own check-ins and stars</text></g><g><rect x="32" y="304" width="208" height="44" rx="6" fill="none" stroke="#94a3b8" stroke-width="1"></rect><text x="44" y="322" font-size="13" font-weight="600" fill="#1f2937">Time &amp; Attendance</