<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 760 236" role="img" aria-label="Each appraisal passes four steps; the other side sees nothing until it is handed over" font-size="13"><rect width="760" height="236" fill="#ffffff"/><defs><marker id="ap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2937">Each appraisal passes four steps; nothing is shown before it is handed over</text><g fill="none" stroke="#94a3b8" stroke-width="1.25"><path d="M184 96H208" marker-end="url(#ap-arrow)"></path><path d="M368 96H392" marker-end="url(#ap-arrow)"></path><path d="M552 96H576" marker-end="url(#ap-arrow)"></path><path d="M104 124V160H268V124" marker-end="url(#ap-arrow)" stroke-dasharray="4 4"></path><path d="M472 124V160H308V124" marker-end="url(#ap-arrow)" stroke-dasharray="4 4"></path></g><g><rect x="24" y="68" width="160" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text x="104" y="92" text-anchor="middle" font-weight="600" fill="#1f2937">1. Self-assessment</text><text x="104" y="110" text-anchor="middle" font-size="11.5" fill="#6b7280">person rates, submits</text></g><g><rect x="208" y="68" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="288" y="92" text-anchor="middle" font-weight="600" fill="#1f2937">2. With reviewer</text><text x="288" y="110" text-anchor="middle" font-size="11.5" fill="#6b7280">reviewer rates, sends</text></g><g><rect x="392" y="68" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#94a3b8" stroke-width="1.25"></rect><text x="472" y="92" text-anchor="middle" font-weight="600" fill="#1f2937">3. To acknowledge</text><text x="472" y="110" text-anchor="middle" font-size="11.5" fill="#6b7280">the person reads it</text></g><g><rect x="576" y="68" width="160" height="56" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"></rect><text x="656" y="92" text-anchor="middle" font-weight="600" fill="#1f2937">4. Acknowledged</text><text x="656" y="110" text-anchor="middle" font-size="11.5" fill="#6b7280">locked</text></g><text x="196" y="178" text-anchor="middle" font-size="11.5" fill="#6b7280">runner: Skip self-assessment</text><text x="410" y="196" text-anchor="middle" font-size="11.5" fill="#6b7280">runner: Return to reviewer</text><text x="24" y="224" font-size="11.5" fill="#6b7280">A runner can Cancel any live appraisal with a reason. Closing the window freezes every step until it is reopened.</text></svg>
